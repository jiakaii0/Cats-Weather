<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Whiskers: HD 🐱</title>
    <style>
        :root {
            /* Very see-through background */
            --card-bg: rgba(0, 0, 0, 0.3); 
            --accent-color: #ff9a9e;
            --text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
            --dropdown-bg: rgba(0, 0, 0, 0.85);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 1s ease;
        }

        /* --- LAYERS --- */
        #bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures image covers screen without stretching */
            z-index: 0;
            transition: opacity 1.5s ease; /* Slower fade for smoother HD load */
            opacity: 0;
            filter: brightness(0.8); /* Slight dim to make text pop */
        }
        #bg-image.visible { opacity: 1; }

        .dark-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.2);
            z-index: 1;
            pointer-events: none;
        }

        #weather-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* --- MAIN CARD --- */
        .container {
            position: relative;
            z-index: 10;
            background: var(--card-bg);
            backdrop-filter: blur(5px); 
            -webkit-backdrop-filter: blur(5px);
            padding: 2rem;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
            color: white;
        }

        h1, h2, .temp, #condition, .cat-quote, #error-msg, #loader {
            text-shadow: var(--text-shadow);
        }

        h1 { margin: 0 0 1.5rem 0; }

        /* --- SEARCH BOX & AUTOCOMPLETE --- */
        .search-wrapper {
            position: relative;
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(0, 0, 0, 0.4);
            color: white;
            font-size: 16px;
            outline: none;
            backdrop-filter: blur(5px);
        }
        input::placeholder { color: rgba(255, 255, 255, 0.8); }

        button {
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            text-shadow: var(--text-shadow);
            transition: background 0.2s;
        }
        button:hover { background: rgba(255, 255, 255, 0.4); }

        /* SUGGESTION DROPDOWN STYLES */
        #suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: var(--dropdown-bg);
            border-radius: 10px;
            margin-top: 5px;
            list-style: none;
            padding: 0;
            max-height: 200px;
            overflow-y: auto;
            z-index: 20;
            border: 1px solid rgba(255,255,255,0.2);
            display: none;
            text-align: left;
        }

        #suggestions-list li {
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 14px;
            color: #eee;
            transition: background 0.2s;
        }

        #suggestions-list li:last-child { border-bottom: none; }
        #suggestions-list li:hover { background: rgba(255, 255, 255, 0.2); color: #fff; }
        
        .flag-icon { margin-right: 8px; }
        .state-info { font-size: 12px; color: #aaa; margin-left: 5px; }

        /* --- REST OF UI --- */
        .cat-frame {
            width: 100%;
            height: 200px;
            border-radius: 15px;
            overflow: hidden;
            background: rgba(0,0,0,0.2);
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .cat-img { width: 100%; height: 100%; object-fit: cover; }
        .temp { font-size: 3.5rem; font-weight: bold; margin: 5px 0; }
        
        .cat-quote {
            font-style: italic;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
            border-left: 4px solid var(--accent-color);
        }

        #loader { display: none; font-weight: bold; color: #fff; margin: 10px; }
        #weather-result { display: none; }
        #error-msg { color: #ff6b6b; display: none; margin-bottom: 10px; font-weight: bold; }

        #suggestions-list::-webkit-scrollbar { width: 8px; }
        #suggestions-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 4px; }
        #suggestions-list::-webkit-scrollbar-track { background: transparent; }

    </style>
</head>
<body>

    <img id="bg-image" alt="Weather Background">
    <div class="dark-overlay"></div>
    <canvas id="weather-canvas"></canvas>

    <div class="container">
        <h1>Weather Whiskers 🐾</h1>
        
        <div class="search-wrapper">
            <input type="text" id="cityInput" placeholder="Type a city..." autocomplete="off" onkeyup="handleTyping(event)">
            <button onclick="manualSearch()">Go</button>
            <ul id="suggestions-list"></ul>
        </div>

        <div id="loader">📡 Finding location...</div>
        <div id="error-msg">City not found.</div>

        <div id="weather-result">
            <div class="cat-frame">
                <img src="" alt="Cat" class="cat-img" id="catImage">
            </div>
            <h2 id="cityName">City</h2>
            <div class="temp" id="tempDisplay">0°</div>
            <div id="condition" style="font-size: 1.2rem; margin-bottom: 5px;">Clear</div>
            <div class="cat-quote" id="catQuote">...</div>
        </div>
    </div>

    <script>
        const cityInput = document.getElementById('cityInput');
        const suggestionsList = document.getElementById('suggestions-list');
        let debounceTimer;
        
        // --- AUTOCOMPLETE ---
        function handleTyping(e) {
            if (e.key === 'Enter') {
                suggestionsList.style.display = 'none';
                manualSearch();
                return;
            }
            const query = cityInput.value.trim();
            if (query.length < 2) {
                suggestionsList.style.display = 'none';
                return;
            }
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                fetchSuggestions(query);
            }, 300);
        }

        async function fetchSuggestions(query) {
            try {
                const response = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${query}&count=5&language=en&format=json`);
                const data = await response.json();
                if (data.results && data.results.length > 0) {
                    renderSuggestions(data.results);
                } else {
                    suggestionsList.style.display = 'none';
                }
            } catch (error) {
                console.error(error);
            }
        }

        function renderSuggestions(cities) {
            suggestionsList.innerHTML = '';
            suggestionsList.style.display = 'block';
            cities.forEach(city => {
                const li = document.createElement('li');
                const admin = city.admin1 ? `, <span class="state-info">${city.admin1}</span>` : '';
                const country = city.country || '';
                const flag = getFlagEmoji(city.country_code);
                li.innerHTML = `<span class="flag-icon">${flag}</span> ${city.name} ${admin} - ${country}`;
                li.onclick = () => selectCity(city);
                suggestionsList.appendChild(li);
            });
        }

        function getFlagEmoji(countryCode) {
            if (!countryCode) return '🌍';
            const codePoints = countryCode.toUpperCase().split('').map(char => 127397 + char.charCodeAt());
            return String.fromCodePoint(...codePoints);
        }

        function selectCity(cityData) {
            cityInput.value = cityData.name;
            suggestionsList.style.display = 'none';
            getWeather(cityData.latitude, cityData.longitude, cityData.name, cityData.country);
        }

        async function manualSearch() {
            const city = cityInput.value;
            if (!city) return;
            getWeather(null, null, city, null);
        }

        // --- MAIN WEATHER ---
        async function getWeather(lat, lon, cityName, countryName) {
            const loader = document.getElementById('loader');
            const result = document.getElementById('weather-result');
            const errorMsg = document.getElementById('error-msg');

            loader.style.display = 'block';
            result.style.display = 'none';
            errorMsg.style.display = 'none';
            stopParticles();

            try {
                if (!lat || !lon) {
                    const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${cityName}&count=1&language=en&format=json`);
                    const geoData = await geoRes.json();
                    if (!geoData.results) throw new Error("City not found");
                    lat = geoData.results[0].latitude;
                    lon = geoData.results[0].longitude;
                    cityName = geoData.results[0].name;
                    countryName = geoData.results[0].country;
                }

                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                const weatherData = await weatherRes.json();
                
                const temp = Math.round(weatherData.current_weather.temperature);
                const code = weatherData.current_weather.weathercode;

                const catRes = await fetch('https://api.thecatapi.com/v1/images/search?mime_types=gif');
                const catData = await catRes.json();

                updateUI(cityName, countryName, temp, code, catData[0].url);
                setAtmosphere(cityName, code, temp);

            } catch (error) {
                console.error(error);
                loader.style.display = 'none';
                errorMsg.style.display = 'block';
                document.body.style.background = "linear-gradient(135deg, #1e3c72 0%, #2a5298 100%)";
            }
        }

        function updateUI(city, country, temp, code, catUrl) {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('weather-result').style.display = 'block';
            document.getElementById('cityName').innerText = `${city}, ${country}`;
            document.getElementById('tempDisplay').innerText = `${temp}°C`;
            document.getElementById('catImage').src = catUrl;

            const commentary = getCatCommentary(code, temp);
            document.getElementById('condition').innerText = commentary.condition;
            document.getElementById('catQuote').innerText = `"${commentary.quote}"`;
        }

        // --- HD BACKGROUND LOGIC ---
        function setAtmosphere(city, code, temp) {
            const bgImage = document.getElementById('bg-image');
            let weatherType = "clear sunny sky";
            let particleType = "none";
            
            // Determine Keywords
            if (code >= 1 && code <= 3) weatherType = "cloudy overcast sky";
            else if (code >= 45 && code <= 48) weatherType = "foggy misty atmosphere";
            else if (code >= 51 && code <= 67) { weatherType = "rainy wet streets"; particleType = "rain"; }
            else if (code >= 71 && code <= 86) { weatherType = "snowy winter wonderland"; particleType = "snow"; }
            else if (code >= 95) { weatherType = "thunderstorm lightning dark sky"; particleType = "rain"; }

            // HD PROMPT: "Aerial View", "8k", "Hyperrealistic"
            // We explicitly ask for a wide angle aerial/drone shot to look like satellite view
            const seed = Math.floor(Math.random() * 9999);
            const prompt = `hyperrealistic aerial drone shot of ${city} city skyline during ${weatherType}, highly detailed, 8k resolution, cinematic lighting, photography --seed ${seed}`;
            
            // HD PARAMETERS: width=1920, height=1080, model=flux
            const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1920&height=1080&nologo=true&model=flux`;

            bgImage.classList.remove('visible'); // Fade out old
            
            const imgLoader = new Image();
            imgLoader.src = imageUrl;
            imgLoader.onload = () => { 
                bgImage.src = imageUrl; 
                bgImage.classList.add('visible'); // Fade in new
            };
            
            if (particleType !== 'none') startParticles(particleType);
        }

        // --- CANVAS PARTICLES ---
        const canvas = document.getElementById('weather-canvas');
        const ctx = canvas.getContext('2d');
        let w, h;
        let particles = [];
        let animationId;

        function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        function startParticles(type) {
            particles = [];
            const count = type === 'rain' ? 500 : 200;
            for(let i=0; i<count; i++) {
                particles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    speedY: type === 'rain' ? Math.random() * 15 + 10 : Math.random() * 2 + 1,
                    speedX: type === 'rain' ? 0 : Math.random() * 2 - 1,
                    len: type === 'rain' ? Math.random() * 20 + 10 : Math.random() * 5,
                    type: type
                });
            }
            animate();
        }

        function animate() {
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = 'white';
            ctx.strokeStyle = 'rgba(255,255,255,0.6)';
            ctx.lineWidth = 2;
            particles.forEach(p => {
                if (p.type === 'rain') { ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, p.y + p.len); ctx.stroke(); } 
                else { ctx.beginPath(); ctx.arc(p.x, p.y, p.len, 0, Math.PI * 2); ctx.fill(); }
                p.y += p.speedY; p.x += p.speedX;
                if (p.y > h) { p.y = -20; p.x = Math.random() * w; }
            });
            animationId = requestAnimationFrame(animate);
        }

        function stopParticles() { if (animationId) cancelAnimationFrame(animationId); ctx.clearRect(0, 0, w, h); }

        function getCatCommentary(code, temp) {
            let condition = "Clear";
            let quote = "Meow.";
            if (code === 0) { condition = "Sunny"; quote = "Sunbeams detected. Recharging."; }
            else if (code <= 3) { condition = "Cloudy"; quote = "No sun? I am disappointed."; }
            else if (code <= 67) { condition = "Rainy"; quote = "Water is evil. Staying inside."; }
            else if (code <= 77) { condition = "Snowy"; quote = "The world is frozen. Cuddle me."; }
            else if (code >= 95) { condition = "Stormy"; quote = "The sky is angry. Hide!"; }
            if (temp > 30) quote = "Too hot. Do not touch me.";
            if (temp < 10) quote = "I require your body heat immediately.";
            return { condition, quote };
        }

        document.addEventListener('click', (e) => {
            if (!document.querySelector('.search-wrapper').contains(e.target)) {
                suggestionsList.style.display = 'none';
            }
        });
    </script>
</body>
</html>
